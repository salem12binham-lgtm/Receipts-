<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إيصالات الحوالات</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --border:#262b36; --text:#e8eaed;
    --muted:#8b90a0; --accent:#3b82f6; --accent2:#22c55e; --danger:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{padding:18px 16px;text-align:center;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
  header h1{margin:0;font-size:20px}
  .tabs{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .tab-btn{flex:1;max-width:150px;padding:11px 8px;border-radius:10px;border:1px solid var(--border);background:#0c0e13;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .wrap{max-width:640px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
  input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:#0c0e13;color:var(--text);font-size:15px}
  textarea{resize:vertical;min-height:60px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .imgpick{border:2px dashed var(--border);border-radius:12px;padding:14px;text-align:center;cursor:pointer;margin-top:10px}
  .preview-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;justify-content:center}
  .preview-thumb{position:relative;width:72px;height:72px}
  .preview-thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px}
  .preview-del{position:absolute;top:-7px;left:-7px;background:var(--danger);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;padding:0;line-height:1;display:flex;align-items:center;justify-content:center}
  button{cursor:pointer;border:none;border-radius:10px;font-size:15px;font-weight:600;padding:13px}
  .btn-main{width:100%;background:var(--accent);color:#fff;margin-top:14px}
  .btn-main:disabled{opacity:.5}
  .search{margin-bottom:10px}
  .item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:12px}
  .item img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex-shrink:0;cursor:pointer}
  .item .info{flex:1;min-width:0}
  .item .title{font-weight:600;font-size:15px}
  .item .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .item .amount{font-size:14px;color:var(--accent2);font-weight:600;margin-top:4px}
  .del{background:none;color:var(--danger);font-size:13px;padding:4px}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .assign-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
  .assign-item:last-child{border-bottom:none}
  .assign-item .info{flex:1;min-width:0}
  .assign-item .title{font-size:14px;font-weight:600}
  .assign-item .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .assign-item .cat{font-size:11px;color:var(--accent);margin-top:2px}
  .assign-item button{background:var(--accent);color:#fff;font-size:12px;padding:8px 10px;flex-shrink:0}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2430;border:1px solid var(--border);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal.show{display:flex}
  .modal-inner{position:relative;max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center}
  .modal img{max-width:100%;max-height:90vh;border-radius:8px}
  .modal-nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:26px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:110;border:2px solid rgba(255,255,255,.7);box-shadow:0 2px 8px rgba(0,0,0,.5)}
  #modalPrev{left:14px}
  #modalNext{right:14px}
  #modalCounter{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:12px;direction:ltr;unicode-bidi:isolate}
  .cfgbox{font-size:13px;color:var(--muted);text-align:center;padding:20px}

  @media print{
    body *{visibility:hidden}
    #printArea, #printArea *{visibility:visible}
    #printArea{display:block !important;position:absolute;top:0;left:0;width:100%;color:#000;background:#fff}
    #printArea table{width:100%;border-collapse:collapse;font-size:12px}
    #printArea th,#printArea td{border:1px solid #999;padding:5px 6px;text-align:right;vertical-align:middle}
    #printArea th{background:#eee}
    #printArea img{width:70px;height:70px;object-fit:cover;border-radius:4px}
    #printArea h2{text-align:center}
  }
</style>
</head>
<body>

<header>
  <h1>📄 إيصالات الحوالات</h1>
  <div class="tabs">
    <button class="tab-btn" data-cat="عام" onclick="switchTab('عام')">📁 عام</button>
    <button class="tab-btn active" data-cat="ورثة" onclick="switchTab('ورثة')">👨‍👩‍👧 ورثة</button>
    <button class="tab-btn" data-cat="التوزيعات" onclick="switchTab('التوزيعات')">💰 التوزيعات</button>
  </div>
</header>
<div class="wrap">

  <div class="card" id="assignCard" style="display:none">
    <label style="margin-top:0">📥 اختر من الإيصالات القديمة (عام) لتحديد أنها توزيعة</label>
    <button id="copyAllBtn" style="width:100%;background:var(--accent2);color:#000;margin-bottom:10px">📥 نسخ كل إيصالات "عام" إلى التوزيعات (بدون تحديد جهة)</button>
    <button id="cleanupBtn" style="width:100%;background:var(--danger);color:#fff;margin-bottom:10px">🧹 حذف النسخ المكررة المعلّقة</button>
    <input id="assignSearch" placeholder="🔍 بحث بالاسم أو الغرض...">
    <div id="assignList" style="margin-top:10px;max-height:340px;overflow-y:auto"></div>
  </div>

  <div class="tabs" id="forFilter" style="display:none;margin-bottom:14px">
    <button class="tab-btn active" data-for="" onclick="setForFilter('')">الكل</button>
    <button class="tab-btn" data-for="بناية" onclick="setForFilter('بناية')">🏢 بناية</button>
    <button class="tab-btn" data-for="الشيخ عبدالله" onclick="setForFilter('الشيخ عبدالله')">👳 الشيخ عبدالله</button>
    <button class="tab-btn" data-for="ورثة" onclick="setForFilter('ورثة')">👨‍👩‍👧 ورثة</button>
  </div>

  <div class="card">
    <label>الغرض</label>
    <input id="purpose" placeholder="مثال: راتب عامل، صيانة، شراء أعلاف...">

    <div class="row2">
      <div>
        <label>لمين (المستلم)</label>
        <input id="recipient" placeholder="اسم الشخص/الجهة">
      </div>
      <div>
        <label>وين راحت (الوجهة)</label>
        <input id="destination" placeholder="بنك / بلد / حساب">
      </div>
    </div>

    <div class="row2">
      <div>
        <label>المبلغ (اختياري)</label>
        <input id="amount" type="number" placeholder="0.00">
      </div>
      <div>
        <label>التاريخ</label>
        <input id="date" type="date">
      </div>
    </div>

    <label>ملاحظات (اختياري)</label>
    <textarea id="notes" placeholder="أي تفاصيل إضافية"></textarea>

    <div class="imgpick" id="picker">
      <div id="pickerText">🖼️ اضغط لتحميل صور الإيصال (يمكن اختيار أكثر من صورة)</div>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
      <div class="preview-grid" id="previewGrid"></div>
    </div>

    <button class="btn-main" id="saveBtn">💾 حفظ الإيصال</button>
    <button id="cancelEditBtn" style="width:100%;background:var(--danger);color:#fff;margin-top:8px;display:none" onclick="cancelEdit()">❌ إلغاء التعديل</button>
  </div>

  <div class="card" id="storageCard">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:14px;color:var(--muted)">💾 مساحة التخزين المستخدمة</span>
      <span id="storagePercent" style="font-size:13px;font-weight:600">-</span>
    </div>
    <div style="background:#0c0e13;border-radius:8px;height:10px;margin-top:8px;overflow:hidden">
      <div id="storageBar" style="height:100%;width:0%;background:var(--accent2);transition:.3s"></div>
    </div>
    <div id="storageDetails" style="font-size:12px;color:var(--muted);margin-top:6px">جاري الحساب...</div>
  </div>

  <div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <label style="margin:0;flex:1;min-width:110px">📊 السنة
      <select id="yearFilter" style="margin-top:6px"></select>
    </label>
    <label style="margin:0;flex:1;min-width:110px">🗓️ الشهر
      <select id="monthFilter" style="margin-top:6px"></select>
    </label>
    <button id="printBtn" style="background:var(--accent2);color:#000;padding:11px 16px;align-self:flex-end">🖨️ طباعة التقرير</button>
  </div>

  <div class="card" id="totalCard" style="text-align:center;padding:14px">
    <div style="font-size:13px;color:var(--muted)" id="totalLabel">إجمالي كل الفترات</div>
    <div style="font-size:24px;font-weight:700;color:var(--accent2);margin-top:4px" id="totalAmount">0</div>
    <div style="font-size:12px;color:var(--muted);margin-top:2px" id="totalCount">0 إيصال</div>
  </div>

  <input class="search" id="search" placeholder="🔍 بحث بالاسم أو الغرض أو الوجهة...">
  <div id="list"></div>
</div>

<div id="printArea" style="display:none"></div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal">
  <button class="modal-nav" id="modalPrev" onclick="galleryPrev(event)">‹</button>
  <div class="modal-inner">
    <img id="modalImg">
    <div id="modalCounter"></div>
  </div>
  <button class="modal-nav" id="modalNext" onclick="galleryNext(event)">›</button>
</div>

<script>
// ============= إعدادات Firebase =============
// أنشئ مشروع Firebase جديد، فعّل Firestore Database،
// وحط بياناته هنا بدل القيم الوهمية.
// مهم: من Firebase Console > Firestore Database > Rules، خلي القواعد تسمح بالقراءة/الكتابة
const firebaseConfig = {
  apiKey: "AIzaSyD-NF5we4zc4lBxSyX6DPqDRyKjAhKYh00",
  authDomain: "receipts-dbd54.firebaseapp.com",
  projectId: "receipts-dbd54",
  storageBucket: "receipts-dbd54.firebasestorage.app",
  messagingSenderId: "168662369086",
  appId: "1:168662369086:web:680cb36c24ff8cfe2ba26f",
  measurementId: "G-JEFQ3M435F"
};
// ==============================================

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const col = db.collection("receipts");

let selectedImages = []; // مصفوفة صور (base64) للإيصال الحالي
let activeCategory = "ورثة";
let editingId = null;

// يرجع مصفوفة صور الإيصال، مع التوافق مع البيانات القديمة (حقل image مفرد)
function getImages(it){
  if (Array.isArray(it.images) && it.images.length) return it.images.filter(Boolean);
  if (it.image) return [it.image];
  return [];
}

function renderPreviewGrid(){
  const grid = document.getElementById("previewGrid");
  const pickerText = document.getElementById("pickerText");
  if (!selectedImages.length) {
    grid.innerHTML = "";
    pickerText.textContent = "🖼️ اضغط لتحميل صور الإيصال (يمكن اختيار أكثر من صورة)";
    return;
  }
  pickerText.textContent = `✅ ${selectedImages.length} صورة مختارة (اضغط لإضافة أكثر)`;
  grid.innerHTML = selectedImages.map((src, i) => `
    <div class="preview-thumb">
      <img src="${src}">
      <button type="button" class="preview-del" onclick="event.stopPropagation();removeSelectedImage(${i})">✕</button>
    </div>
  `).join("");
}

window.removeSelectedImage = (i) => {
  selectedImages.splice(i, 1);
  renderPreviewGrid();
};

window.editItem = (id) => {
  const it = allItems.find(x => x.id === id);
  if (!it) return;
  document.getElementById("purpose").value = it.purpose || "";
  document.getElementById("recipient").value = it.recipient || "";
  document.getElementById("destination").value = it.destination || "";
  document.getElementById("amount").value = it.amount ?? "";
  document.getElementById("date").value = it.date || "";
  document.getElementById("notes").value = it.notes || "";
  selectedImages = getImages(it).slice();
  renderPreviewGrid();
  editingId = id;
  const btn = document.getElementById("saveBtn");
  btn.textContent = "💾 تحديث الإيصال";
  btn.style.background = "var(--accent2)";
  btn.style.color = "#000";
  document.getElementById("cancelEditBtn").style.display = "block";
  document.querySelector(".card").scrollIntoView({ behavior: "smooth" });
};

window.cancelEdit = () => {
  editingId = null;
  document.getElementById("purpose").value = "";
  document.getElementById("recipient").value = "";
  document.getElementById("destination").value = "";
  document.getElementById("amount").value = "";
  document.getElementById("notes").value = "";
  selectedImages = [];
  renderPreviewGrid();
  const btn = document.getElementById("saveBtn");
  btn.textContent = "💾 حفظ الإيصال";
  btn.style.background = "var(--accent)";
  btn.style.color = "#fff";
  document.getElementById("cancelEditBtn").style.display = "none";
};

window.switchTab = (cat) => {
  activeCategory = cat;
  document.querySelectorAll('.tabs button[data-cat]').forEach(b => {
    b.classList.toggle("active", b.dataset.cat === cat);
  });
  document.getElementById("assignCard").style.display = (cat === "التوزيعات") ? "block" : "none";
  document.getElementById("forFilter").style.display = (cat === "التوزيعات") ? "flex" : "none";
  forFilterValue = "";
  document.querySelectorAll("#forFilter .tab-btn").forEach(b => b.classList.toggle("active", b.dataset.for === ""));
  populateYears();
  renderList();
  updateTotals();
  renderAssignList();
};
document.getElementById("date").valueAsDate = new Date();

// اختيار/ضغط الصورة
document.getElementById("picker").onclick = () => document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = (e) => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const maxW = 1000;
        const scale = Math.min(1, maxW / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        selectedImages.push(canvas.toDataURL("image/jpeg", 0.5));
        renderPreviewGrid();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  e.target.value = ""; // تسمح باختيار نفس الملف مرة أخرى لاحقًا
};

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2000);
}

// حفظ
document.getElementById("saveBtn").onclick = async () => {
  const purpose = document.getElementById("purpose").value.trim();
  const recipient = document.getElementById("recipient").value.trim();
  const destination = document.getElementById("destination").value.trim();
  const amount = document.getElementById("amount").value;
  const date = document.getElementById("date").value;
  const notes = document.getElementById("notes").value.trim();

  if (!purpose || !recipient) { toast("⚠️ لازم تكتب الغرض والمستلم"); return; }

  const btn = document.getElementById("saveBtn");
  btn.disabled = true; btn.textContent = editingId ? "⏳ جاري التحديث..." : "⏳ جاري الحفظ...";

  try {
    if (editingId) {
      await col.doc(editingId).update({
        purpose, recipient, destination,
        amount: amount ? parseFloat(amount) : null,
        date: date || null,
        notes,
        images: selectedImages,
        image: firebase.firestore.FieldValue.delete() // تنظيف الحقل القديم بعد الانتقال للمصفوفة
      });
      toast("✅ تم تحديث الإيصال");
    } else {
      await col.add({
        purpose, recipient, destination,
        amount: amount ? parseFloat(amount) : null,
        date: date || null,
        notes,
        images: selectedImages,
        category: activeCategory,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      toast("✅ تم حفظ الإيصال");
    }
    editingId = null;
    document.getElementById("purpose").value = "";
    document.getElementById("recipient").value = "";
    document.getElementById("destination").value = "";
    document.getElementById("amount").value = "";
    document.getElementById("notes").value = "";
    selectedImages = [];
    renderPreviewGrid();
  } catch (err) {
    toast("❌ خطأ: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "💾 حفظ الإيصال";
    btn.style.background = "var(--accent)";
    btn.style.color = "#fff";
    document.getElementById("cancelEditBtn").style.display = "none";
  }
};

// عرض القائمة (لحظي)
let allItems = [];
col.orderBy("createdAt", "desc").onSnapshot((snap) => {
  allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  populateYears();
  renderList();
  updateStorageUsage();
  updateTotals();
  renderAssignList();
}, (err) => {
  document.getElementById("list").innerHTML =
    `<div class="cfgbox">⚠️ ما قدر يتصل بقاعدة البيانات.<br>تأكد من إعدادات Firebase في أعلى الكود.<br><br>${err.message}</div>`;
});

function itemCardHtml(it, mode){
  const imgs = getImages(it);
  const imgHtml = imgs.length
    ? `<div style="position:relative;flex-shrink:0;cursor:pointer" onclick="openGalleryForItem('${it.id}')">
         <img src="${imgs[0]}" style="width:64px;height:64px;object-fit:cover;border-radius:8px">
         ${imgs.length > 1 ? `<div style="position:absolute;bottom:-4px;left:-4px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px;line-height:1.4">${imgs.length}</div>` : ""}
       </div>`
    : `<div style="width:64px;height:64px;border-radius:8px;background:#0c0e13;display:flex;align-items:center;justify-content:center;flex-shrink:0">📄</div>`;

  const forHtml = mode === "pending"
    ? `<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
        <button style="background:var(--accent);color:#fff;font-size:11px;padding:6px 8px" onclick="setForOnItem('${it.id}','بناية')">🏢 بناية</button>
        <button style="background:var(--accent);color:#fff;font-size:11px;padding:6px 8px" onclick="setForOnItem('${it.id}','الشيخ عبدالله')">👳 الشيخ عبدالله</button>
        <button style="background:var(--accent);color:#fff;font-size:11px;padding:6px 8px" onclick="setForOnItem('${it.id}','ورثة')">👨‍👩‍👧 ورثة</button>
      </div>`
    : (it.for ? `<div class="sub" style="color:var(--accent)">🏷️ ${escapeHtml(it.for)} <span onclick="event.stopPropagation();window.setForOnItem('${it.id}',null)" style="cursor:pointer;color:var(--muted)">✏️ تغيير</span></div>` : "");

  return `
    <div class="item">
      ${imgHtml}
      <div class="info">
        <div class="title">${escapeHtml(it.purpose||"")}</div>
        <div class="sub">👤 ${escapeHtml(it.recipient||"")} &nbsp;|&nbsp; 📍 ${escapeHtml(it.destination||"-")}</div>
        <div class="sub">📅 ${it.date||"-"}${it.notes ? " • " + escapeHtml(it.notes) : ""}</div>
        ${forHtml}
        ${it.amount ? `<div class="amount">${it.amount}</div>` : ""}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${(mode !== "normal" && !it.sourceId) ? `<button class="del" style="color:var(--accent)" onclick="restoreToGeneral('${it.id}')">↩️</button>` : ""}
        <button class="del" style="color:var(--accent2)" onclick="editItem('${it.id}')">✏️</button>
        <button class="del" onclick="deleteItem('${it.id}')">🗑️</button>
      </div>
    </div>
  `;
}

function renderList(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const matchesSearch = (it) => !q ||
    (it.purpose||"").toLowerCase().includes(q) ||
    (it.recipient||"").toLowerCase().includes(q) ||
    (it.destination||"").toLowerCase().includes(q);

  const list = document.getElementById("list");

  if (activeCategory === "التوزيعات") {
    const pending = allItems.filter(it => (it.category||"عام") === "التوزيعات" && !it.for && matchesSearch(it))
      .sort((a,b) => (b.date||"").localeCompare(a.date||""));
    const distributed = allItems.filter(it => (it.category||"عام") === "التوزيعات" && it.for && (!forFilterValue || it.for === forFilterValue) && matchesSearch(it))
      .sort((a,b) => (b.date||"").localeCompare(a.date||""));

    let html = "";
    if (pending.length) {
      html += `<div style="font-weight:700;margin:4px 0 8px;color:var(--muted)">⏳ قيد التوزيع (${pending.length})</div>`;
      html += pending.map(it => itemCardHtml(it, "pending")).join("");
    }
    html += `<div style="font-weight:700;margin:18px 0 8px;color:var(--muted)">✅ موزّعة (${distributed.length})</div>`;
    html += distributed.length ? distributed.map(it => itemCardHtml(it, "distributed")).join("") : `<div class="empty">لا توجد إيصالات موزّعة بعد</div>`;
    list.innerHTML = html;
    return;
  }

  const filtered = allItems.filter(it => (it.category || "عام") === activeCategory && matchesSearch(it))
    .sort((a,b) => (b.date||"").localeCompare(a.date||""));

  if (!filtered.length) {
    list.innerHTML = `<div class="empty">لا توجد إيصالات بعد</div>`;
    return;
  }

  list.innerHTML = filtered.map(it => itemCardHtml(it, "normal")).join("");
}

function updateStorageUsage(){
  // تقدير تقريبي: حجم كل مستند = طول نص الصورة (base64) + بيانات نصية أخرى
  let totalBytes = 0;
  allItems.forEach(it => {
    getImages(it).forEach(img => totalBytes += img.length * 0.75); // base64 -> تقريبًا حجم فعلي
    totalBytes += JSON.stringify({p:it.purpose,r:it.recipient,d:it.destination,n:it.notes}).length;
  });

  const totalMB = totalBytes / (1024*1024);
  const limitMB = 1024; // الحد المجاني لـ Firestore (Spark) تقريبًا 1GiB
  const percent = Math.min(100, (totalMB / limitMB) * 100);
  const remainingMB = Math.max(0, limitMB - totalMB);

  document.getElementById("storageBar").style.width = percent.toFixed(2) + "%";
  document.getElementById("storageBar").style.background =
    percent > 80 ? "var(--danger)" : percent > 50 ? "#eab308" : "var(--accent2)";
  document.getElementById("storagePercent").textContent = percent.toFixed(2) + "%";

  const usedText = totalMB < 1 ? (totalBytes/1024).toFixed(0) + " كيلوبايت" : totalMB.toFixed(1) + " ميجابايت";
  const remainText = remainingMB > 1024 ? (remainingMB/1024).toFixed(2) + " جيجابايت" : remainingMB.toFixed(0) + " ميجابايت";
  document.getElementById("storageDetails").textContent =
    `مستخدم: ${usedText} من ${(limitMB/1024).toFixed(0)} جيجابايت (تقريبي) — الباقي: ${remainText} — عدد الإيصالات: ${allItems.length}`;
}

document.getElementById("search").oninput = renderList;

function renderAssignList(){
  if (activeCategory !== "التوزيعات") return;
  const q = document.getElementById("assignSearch").value.trim().toLowerCase();
  const alreadyCopied = new Set(
    allItems.filter(it => it.category === "التوزيعات" && it.sourceId).map(it => it.sourceId)
  );
  const source = allItems.filter(it =>
    (it.category || "عام") === "عام" &&
    !alreadyCopied.has(it.id) &&
    (!q ||
      (it.purpose||"").toLowerCase().includes(q) ||
      (it.recipient||"").toLowerCase().includes(q) ||
      (it.destination||"").toLowerCase().includes(q))
  ).sort((a,b) => (b.date||"").localeCompare(a.date||""));

  const box = document.getElementById("assignList");
  if (!source.length) {
    box.innerHTML = `<div class="empty" style="padding:14px">لا توجد إيصالات متبقية بحاجة لتحديد جهة</div>`;
    return;
  }

  box.innerHTML = source.map(it => `
    <div class="assign-item">
      <div class="info">
        <div class="title">${escapeHtml(it.purpose||"")}</div>
        <div class="sub">👤 ${escapeHtml(it.recipient||"")} ${it.date ? " • 📅 " + it.date : ""}${it.amount ? " • " + it.amount : ""}</div>
      </div>
      <button onclick="copySingleToDistribution('${it.id}')">➕ نسخ للتوزيعات</button>
    </div>
  `).join("");
}
document.getElementById("assignSearch").oninput = renderAssignList;

window.copySingleToDistribution = async (id) => {
  try {
    const src = allItems.find(it => it.id === id);
    if (!src) { toast("❌ الإيصال غير موجود"); return; }
    await col.add({
      purpose: src.purpose || "",
      recipient: src.recipient || "",
      destination: src.destination || "",
      amount: src.amount ?? null,
      date: src.date || null,
      notes: src.notes || "",
      images: getImages(src),
      category: "التوزيعات",
      for: null,
      sourceId: id,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast("✅ تم نسخ الإيصال — حدد جهته تحت بقسم قيد التوزيع");
  } catch (err) {
    toast("❌ خطأ: " + err.message);
  }
};

window.copyAllToDistribution = async () => {
  const source = allItems.filter(it => (it.category || "عام") === "عام");
  const alreadyCopied = new Set(
    allItems.filter(it => it.category === "التوزيعات" && it.sourceId).map(it => it.sourceId)
  );
  const toCopy = source.filter(it => !alreadyCopied.has(it.id));

  if (!toCopy.length) { toast("✅ كل إيصالات عام منسوخة بالفعل"); return; }
  if (!confirm(`هل تبي تنسخ ${toCopy.length} إيصال من "عام" إلى "التوزيعات"؟`)) return;

  const btn = document.getElementById("copyAllBtn");
  btn.disabled = true; btn.textContent = "⏳ جاري النسخ...";
  try {
    const batch = db.batch();
    toCopy.forEach(it => {
      const ref = col.doc();
      batch.set(ref, {
        purpose: it.purpose || "",
        recipient: it.recipient || "",
        destination: it.destination || "",
        amount: it.amount ?? null,
        date: it.date || null,
        notes: it.notes || "",
        images: getImages(it),
        category: "التوزيعات",
        for: null,
        sourceId: it.id,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    await batch.commit();
    toast(`✅ تم نسخ ${toCopy.length} إيصال إلى التوزيعات`);
  } catch (err) {
    toast("❌ خطأ: " + err.message);
  } finally {
    btn.disabled = false; btn.textContent = "📥 نسخ كل إيصالات \"عام\" إلى التوزيعات (بدون تحديد جهة)";
  }
};
document.getElementById("copyAllBtn").onclick = copyAllToDistribution;

window.cleanupDuplicates = async () => {
  // لكل sourceId له نسخة موزّعة (for موجود)، احذف أي نسخة أخرى معلقة (for=null) بنفس sourceId
  const distributedSourceIds = new Set(
    allItems.filter(it => it.category === "التوزيعات" && it.sourceId && it.for).map(it => it.sourceId)
  );
  const duplicates = allItems.filter(it =>
    it.category === "التوزيعات" && it.sourceId && !it.for && distributedSourceIds.has(it.sourceId)
  );

  if (!duplicates.length) { toast("✅ لا توجد نسخ مكررة معلّقة"); return; }
  if (!confirm(`هل تبي تحذف ${duplicates.length} نسخة معلّقة مكررة (وأصلها الموزّع بيبقى)؟`)) return;

  const btn = document.getElementById("cleanupBtn");
  btn.disabled = true; btn.textContent = "⏳ جاري التنضيف...";
  try {
    const batch = db.batch();
    duplicates.forEach(it => batch.delete(col.doc(it.id)));
    await batch.commit();
    toast(`✅ تم حذف ${duplicates.length} نسخة مكررة`);
  } catch (err) {
    toast("❌ خطأ: " + err.message);
  } finally {
    btn.disabled = false; btn.textContent = "🧹 حذف النسخ المكررة المعلّقة";
  }
};
document.getElementById("cleanupBtn").onclick = cleanupDuplicates;

let forFilterValue = "";
window.setForFilter = (val) => {

function populateYears(){
  const years = new Set();
  allItems.filter(it => (it.category || "عام") === activeCategory)
    .forEach(it => { if (it.date) years.add(it.date.slice(0,4)); });
  const sel = document.getElementById("yearFilter");
  const current = sel.value;
  const sorted = [...years].sort().reverse();
  sel.innerHTML = `<option value="">كل السنوات</option>` +
    sorted.map(y => `<option value="${y}">${y}</option>`).join("");
  if (sorted.includes(current)) sel.value = current;
}

const monthNames = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

function populateMonths(){
  const sel = document.getElementById("monthFilter");
  if (sel.options.length) return; // ثابتة، تُملأ مرة وحدة
  sel.innerHTML = `<option value="">كل الشهور</option>` +
    monthNames.map((m,i) => `<option value="${String(i+1).padStart(2,"0")}">${m}</option>`).join("");
}
populateMonths();

function updateTotals(){
  const year = document.getElementById("yearFilter").value;
  const month = document.getElementById("monthFilter").value;

  const items = allItems.filter(it => (it.category || "عام") === activeCategory)
    .filter(it => activeCategory !== "التوزيعات" || (it.for && (!forFilterValue || it.for === forFilterValue)))
    .filter(it => !year || (it.date && it.date.startsWith(year)))
    .filter(it => !month || (it.date && it.date.slice(5,7) === month));

  const total = items.reduce((s,it) => s + (it.amount||0), 0);

  let label = "إجمالي كل الفترات";
  if (year && month) label = `إجمالي ${monthNames[parseInt(month,10)-1]} ${year}`;
  else if (year) label = `إجمالي سنة ${year} كاملة`;
  else if (month) label = `إجمالي شهر ${monthNames[parseInt(month,10)-1]} (كل السنوات)`;
  if (activeCategory === "التوزيعات" && forFilterValue) label += ` - ${forFilterValue}`;

  document.getElementById("totalLabel").textContent = label;
  document.getElementById("totalAmount").textContent = total.toLocaleString();
  document.getElementById("totalCount").textContent = `${items.length} إيصال`;
}

document.getElementById("yearFilter").onchange = updateTotals;
document.getElementById("monthFilter").onchange = updateTotals;

document.getElementById("printBtn").onclick = () => {
  const year = document.getElementById("yearFilter").value;
  const month = document.getElementById("monthFilter").value;
  const baseFilter = it => (it.category || "عام") === activeCategory
    && (!year || (it.date && it.date.startsWith(year)))
    && (!month || (it.date && it.date.slice(5,7) === month));

  const periodLabel = year && month ? `${monthNames[parseInt(month,10)-1]} ${year}`
    : year ? `سنة ${year}`
    : month ? `شهر ${monthNames[parseInt(month,10)-1]} (كل السنوات)`
    : "جميع الفترات";

  const rowsHtml = (items) => items.map((it,i) => {
    const imgs = getImages(it);
    return `
    <tr>
      <td>${i+1}</td>
      <td>${imgs.length ? `<div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center">${imgs.map(src => `<img src="${src}">`).join("")}</div>` : "-"}</td>
      <td>${it.date||"-"}</td>
      <td>${escapeHtml(it.purpose||"")}</td>
      <td>${escapeHtml(it.recipient||"")}</td>
      <td>${escapeHtml(it.destination||"")}</td>
      <td>${it.amount ?? "-"}</td>
      <td>${escapeHtml(it.notes||"")}</td>
    </tr>
  `;
  }).join("");

  const tableFor = (items, heading) => {
    const totalAmount = items.reduce((s,it) => s + (it.amount||0), 0);
    return `
    <h2>${heading}</h2>
    <table>
      <thead>
        <tr><th>#</th><th>الإيصال</th><th>التاريخ</th><th>الغرض</th><th>المستلم</th><th>الوجهة</th><th>المبلغ</th><th>ملاحظات</th></tr>
      </thead>
      <tbody>${rowsHtml(items)}</tbody>
      <tfoot><tr><td colspan="6" style="text-align:left"><b>الإجمالي</b></td><td colspan="2"><b>${totalAmount}</b></td></tr></tfoot>
    </table>`;
  };

  let tableHtml = "";
  let anyItems = false;

  if (activeCategory === "التوزيعات" && !forFilterValue) {
    // تقرير مفصّل لكل جهة لحالها
    const groups = ["بناية", "الشيخ عبدالله", "ورثة"];
    let grandTotal = 0;
    groups.forEach(g => {
      const items = allItems.filter(it => baseFilter(it) && it.for === g).sort((a,b) => (a.date||"").localeCompare(b.date||""));
      if (items.length) {
        anyItems = true;
        grandTotal += items.reduce((s,it) => s + (it.amount||0), 0);
        tableHtml += tableFor(items, `${g} - ${periodLabel}`) + `<div style="page-break-after:always"></div>`;
      }
    });
    if (anyItems) {
      tableHtml += `<h2>الإجمالي العام لكل الجهات: ${grandTotal.toLocaleString()}</h2>`;
    }
  } else {
    const items = allItems.filter(it =>
      baseFilter(it) && (activeCategory !== "التوزيعات" || it.for === forFilterValue)
    ).sort((a,b) => (a.date||"").localeCompare(b.date||""));
    if (items.length) {
      anyItems = true;
      const forLabel = (activeCategory === "التوزيعات" && forFilterValue) ? ` - ${forFilterValue}` : "";
      tableHtml = tableFor(items, `تقرير الحوالات - ${activeCategory}${forLabel} - ${periodLabel}`);
    }
  }

  if (!anyItems) { toast("⚠️ لا توجد تحويلات لهذه الفترة"); return; }

  const fullPage = `<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<title>تقرير الحوالات</title>
<style>
  body{font-family:'Segoe UI',Tahoma,sans-serif;padding:16px;color:#111}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:20px}
  th,td{border:1px solid #999;padding:6px;text-align:right;vertical-align:middle}
  th{background:#eee}
  img{width:60px;height:60px;object-fit:cover;border-radius:4px}
  h2{text-align:center}
  .hint{text-align:center;color:#666;font-size:13px;margin-bottom:14px}
</style></head>
<body>
  <div class="hint">لطباعة أو حفظ هذا التقرير كـ PDF، استخدم زر المشاركة/القائمة بالمتصفح ثم اختر "طباعة"</div>
  ${tableHtml}
</body></html>`;

  const blob = new Blob([fullPage], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  window.open(url, "_blank");
};

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

window.deleteItem = async (id) => {
  if (!confirm("متأكد تبي تحذف هذا الإيصال؟")) return;
  await col.doc(id).delete();
  toast("🗑️ تم الحذف");
};

let galleryImages = [];
let galleryIndex = 0;

function renderGallery(){
  document.getElementById("modalImg").src = galleryImages[galleryIndex] || "";
  document.getElementById("modalCounter").textContent =
    galleryImages.length > 1 ? `${galleryIndex + 1} / ${galleryImages.length}` : "";
  const show = galleryImages.length > 1 ? "flex" : "none";
  document.getElementById("modalPrev").style.display = show;
  document.getElementById("modalNext").style.display = show;
}

window.openGallery = (imgs, idx) => {
  if (!imgs || !imgs.length) return;
  galleryImages = imgs;
  galleryIndex = idx || 0;
  renderGallery();
  document.getElementById("modal").classList.add("show");
};

window.openGalleryForItem = (id) => {
  const it = allItems.find(x => x.id === id);
  if (!it) return;
  openGallery(getImages(it), 0);
};

window.galleryPrev = (e) => {
  e.stopPropagation();
  galleryIndex = (galleryIndex - 1 + galleryImages.length) % galleryImages.length;
  renderGallery();
};
window.galleryNext = (e) => {
  e.stopPropagation();
  galleryIndex = (galleryIndex + 1) % galleryImages.length;
  renderGallery();
};

document.getElementById("modal").onclick = () => document.getElementById("modal").classList.remove("show");
</script>
